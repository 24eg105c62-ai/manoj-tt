spring.application.name=pocket-skill-track-backend
server.port=8081

# MySQL 8 Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pocketskilltrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# File Storage for PDFs
app.upload.dir=./uploads/pdfs

# Optional LLM Configuration (fallback heuristic active if not configured)
app.llm.enabled=false
app.llm.api-url=https://api.openai.com/v1/chat/completions
app.llm.api-key=
app.llm.model=gpt-3.5-turbo

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
